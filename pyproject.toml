[project]
name = "tool-auto-sub"
version = "0.2.0"
description = "Local-first video localization tool MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.136",
  "uvicorn>=0.49",
  "sqlalchemy>=2.0",
  "alembic>=1.18",
  "pydantic>=2.13",
  "httpx>=0.28",
  "faster-whisper>=1.2",
  "jsonschema>=4.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
